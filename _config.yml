# Site settings
title: "Citizens' Track on AI"
email: contact@citizenstrack.org
description: Join the campaign for a future of AI shaped by us all.
baseurl: "" # the subpath of your site, e.g. /blog/
url: "" # the base hostname & protocol for your site

twitter_username:
github_username:

# Build settings
markdown: kramdown
future: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

collections:
  resources:
    output: true
    permalink: /:year/:slug/
  events:
    output: true
    permalink: /events/:slug/

exclude:
  - helper_scripts
  - Gemfile
  - Gemfile.lock
  - .bundle
  - .sass-cache
  - .jekyll-cache
