# Site settings
title: "Citizens' Track on AI"
email: contact@citizens-track.org
description: Join the campaign for a future of AI shaped by us all.
baseurl: "" # the subpath of your site, e.g. /blog/
url: "" # the base hostname & protocol for your site

twitter_username:
github_username:

brand-primary: "#00447c"
brand-accent: "#40a9ff"
brand-dark: "#00447c"
brand-light: "#efeee5"

# Build settings
markdown: kramdown
future: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

collections:
  resources:
    output: true
    permalink: /:year/:slug/
  events:
    output: true
    permalink: /events/:slug/

include:
  - .well-known

exclude:
  - helper_scripts
  - Gemfile
  - Gemfile.lock
  - .bundle
  - .sass-cache
  - .jekyll-cache

