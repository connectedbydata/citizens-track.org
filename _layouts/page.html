<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<body id="page-top">
    {% include nav.html %}

    <header class="short-header">
        <div class="header-content">
            <div class="container">
                <div class="row">
                    <div class="col-lg-8 col-lg-offset-2 col-md-10 col-md-offset-1 text-center">
                        {% if page.subtitle %}
                        <div class="news-date"
                            style="color: {{ site.brand-accent | default: '#89afad' }}; font-family: 'Outfit', sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px;">
                            {{ page.subtitle }}
                        </div>
                        {% endif %}
                        <h1 class="header-title-stacked" style="font-size: 38px; line-height: 1.2; text-shadow: none;">
                            {{ page.title }}</h1>
                        <hr class="header-divider">
                    </div>
                </div>
            </div>
        </div>
    </header>

    <article class="post-content-section" style="padding: 40px 0 80px; background-color: #fdfcfc;">
        <div class="container">
            <div class="row">
                <div class="col-lg-8 col-lg-offset-2 col-md-10 col-md-offset-1">
                    <div class="post-body" style="font-size: 16px; line-height: 1.8; color: #242a38;">
                        {{ content }}
                    </div>
                </div>
            </div>
        </div>
    </article>

    {% include footer.html %}
    {% include scripts.html %}
</body>

</html>
